name: pilot

# Manual only. Draws a small sample and commits the dataset to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      per_stratum:
        description: "Repos per stratum (72 strata)"
        default: "15"

concurrency:
  group: census-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PER_STRATUM: ${{ inputs.per_stratum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .cache/census
          key: census-pilot-${{ github.run_id }}
          restore-keys: census-pilot-
      - run: python -m pip install -e .
      - run: census sample --per-stratum "$PER_STRATUM"
      - name: Collect (resumes from the cache; rerun the workflow until every repo is done)
        continue-on-error: true
        run: timeout 100m census collect --min-interval 0.5
      - run: census drift-eval
      - run: census analyze
      - run: census report
      - run: python scripts/build_readme.py
      - run: python scripts/social_preview.py
      - name: Commit the dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results docs/report docs/social-preview.png README.md
          git commit -m "Pilot census run ${{ github.run_id }}" || echo "nothing to commit"
          git push
