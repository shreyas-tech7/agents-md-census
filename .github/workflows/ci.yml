name: ci

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install, lint and test offline (same steps as init.sh)
        run: ./init.sh
      - name: Drift check on this repo's own AGENTS.md and CLAUDE.md
        run: .venv/bin/census self-check
      - name: Links
        run: python scripts/check_links.py
